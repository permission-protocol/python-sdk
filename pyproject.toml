[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "permission-protocol"
version = "0.1.0"
description = "Python SDK for Permission Protocol authority receipts"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Permission Protocol" }
]
keywords = ["ai", "authorization", "security", "receipts", "approval"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.25.0",
  "typing_extensions>=4.5.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://permissionprotocol.com"
Repository = "https://github.com/permissionprotocol/permission-protocol-python"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["permission_protocol*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
